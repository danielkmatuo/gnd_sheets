<!DOCTYPE html>

<html lang="en-US">
    <head>
        <title>G&D Sheets</title>
        <meta charset="utf-8">
        <meta name="author" content="danielkmatuo">
    </head>
    <body>
        <div>
            <fieldset>
                <legend>Character main infos</legend>
                <p id="name"></p>
                <p id="level"></p>
                <p id="class"></p>
                <p id="race"></p>
            </fieldset>
            <fieldset>
                <legend>Character ability scores</legend>
                <p id="str"></p>
                <p id="dex"></p>
                <p id="con"></p>
                <p id="int"></p>
                <p id="wis"></p>
                <p id="cha"></p>
            </fieldset>
            <fieldset>
                <legend>Character combat infos</legend>
                <p id="hp"></p>
                <p id="ac"></p>
                <p id="speed"></p>
            </fieldset>
            <fieldset>
                <legend>Character proficiencies</legend>
                <p id="armor"></p>
                <p id="weapons"></p>
                <p id="tools"></p>
                <p id="skills"></p>
                <p id="saving"></p>
            </fieldset>
        </div>
        <div id="redirect-edit">
        </div>
    </body>
    <script src="/js/view.js"></script>
</html>
