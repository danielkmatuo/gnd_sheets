<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="author" content="danielkmatuo">
        <title>G&D sheets</title>
    </head>

    <body>
        <h1>Existing characters</h1>
        {{range .}}
            <div>
                <h3>Name: {{.Name}}</h3>
                <h3>Level: {{.Level}}</h3>
                <h3>Class: {{.Class}}</h3>
                <h3>Race: {{.Race}}</h3>
            </div>
        {{end}}
        <a href="/">
            Create a new character.
        </a>    
    </body>
</html>
