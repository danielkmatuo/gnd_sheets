<!DOCTYPE html>

<html lang="en-US">
    <head>
        <title>G&D Sheets</title>
        <meta charset="utf-8">
        <meta name="author" content="danielkmatuo">
    </head>
    <body>
        <h1>Edit you character</h1>
        <p id="name"></p>
        <p id="class"></p>
        <p id="race"></p>
        <p id="skills"></p>
        <form id="character-form">
            <div>
                <button type="button" id="level-up">+</button>
            </div>
            <div>
                <label for="level">Level</label>
                <input type="number" id="level">
            </div>
            <button type="submit">Edit character</button>
        </form>
        <script src="/js/edit"></script>
    </body>
</html>
