<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="author" content="danielkmatuo">
        <title>G&D Sheets</title>
    </head>
        
    <body>
        <h1>Create your first character</h1>
        <form action="/characters/create" method="POST" id="character-form">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="some cool name">
            </div>
            <div>
                <label for="level" type="number">Level</label>
                <select id="level" name="level">
                    <option value=1>1</option>
                    <option value=2>2</option>
                    <option value=3>3</option>
                    <option value=4>4</option>
                    <option value=5>5</option>
                    <option value=6>6</option>
                    <option value=7>7</option>
                    <option value=8>8</option>
                    <option value=9>9</option>
                    <option value=10>10</option>
                    <option value=11>11</option>
                    <option value=12>12</option>
                    <option value=13>13</option>
                    <option value=14>14</option>
                    <option value=15>15</option>
                    <option value=16>16</option>
                    <option value=17>17</option>
                    <option value=18>18</option>
                    <option value=19>19</option>
                    <option value=20>20</option>
                </select>
            </div>
            <div>
                <label for="race">Race</label>
                <select id="race" name="race">
                    <option value="dragonborn">Dragonborn</option>
                    <option value="dwarf">Dwarf</option>
                    <option value="elf">Elf</option>
                    <option value="gnome">Gnome</option>
                    <option value="halfelf">Half-elf</option>
                    <option value="halforc">Half-orc</option>
                    <option value="halfling">Halfling</option>
                    <option value="human">Human</option>
                    <option value="tiefling">Tiefling</option>
                </select>
            </div>
            <div id="abilities">
                <fieldset>
                    <legend>Choose your character ability scores</legend>
                    <label for="str">Strengh</label>
                    <button id="less-str" type="button">-</button>
                    <input id="str" name="str" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-str" type="button">+</button>
                    
                    <label for="dex">Dexterity</label>
                    <button id="less-dex" type="button">-</button>
                    <input id="dex" name="dex" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-dex" type="button">+</button>
                    
                    <label for="con">Constitution</label>
                    <button id="less-con" type="button">-</button>
                    <input id="con" name="con" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-con" type="button">+</button>
                    
                    <label for="int">Intelligence</label>
                    <button id="less-int" type="button">-</button>
                    <input id="int" name="int" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-int" type="button">+</button>
                    
                    <label for="wis">Wisdom</label>
                    <button id="less-wis" type="button">-</button>
                    <input id="wis" name="wis" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-wis" type="button">+</button>
                    
                    <label for="cha">Charisma</label>
                    <button id="less-cha" type="button">-</button>
                    <input id="cha" name="cha" type="text" value="8" placeholder="8" min="8" max="15"></input>
                    <button id="more-cha" type="button">+</button>

                    <p id="curr-cost">Current Cost: 0</p>
                </fieldset>
            </div>
            <div>
                <label for="class">Class</label>
                <select id="class" name="class">
                    <option value="">--</option>
                    <option value="barbarian">Barbarian</option>
                    <option value="bard">Bard</option>
                    <option value="cleric">Cleric</option>
                    <option value="druid">Druid</option>
                    <option value="fighter">Fighter</option>
                    <option value="monk">Monk</option>
                    <option value="paladin">Paladin</option>
                    <option value="ranger">Ranger</option>
                    <option value="rogue">Rogue</option>
                    <option value="sorcerer">Sorcerer</option>
                    <option value="warlock">Warlock</option>
                    <option value="wizard">Wizard</option>
                </select>
            </div>
            <div id="character-stats"></div>
            <div id="class-info"></div>
            <button type="submit">Create character</button>
        </form>
        <a href="/characters">
            Already have a character? Click here.
        </a>
        <script src="/js/create"></script>
    </body>    
</html>
